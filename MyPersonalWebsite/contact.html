<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="How to get in touch with me.">
    <title>Contact Me</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="contact-page">
    <main class="desktop">
        <section class="about-window contact-page-window" aria-labelledby="contact-heading">
            <div class="section-titlebar">
                <h2 id="contact-heading">Contact Me</h2>
                <span class="section-tag">GET IN TOUCH</span>
            </div>

            <div class="info-grid">

                
                <article class="info-box">
                    <h3 class="info-box-title"><span class="info-box-icon">✉</span> Email Addresses</h3>
                    <div class="info-box-body">
                        <ul class="email-list">
                            <li>
                                <span class="email-label">Personal</span>
                                <a href="mailto:personal@example.com">dbueser@1209@gmail.com</a>
                            </li>
                        </ul>
                    </div>
                </article>

                
                <article class="info-box">
                    <h3 class="info-box-title"><span class="info-box-icon">✎</span> Send Me a Message</h3>
                    <div class="info-box-body">
                        <form class="contact-form" action="https://formsubmit.co/personal@example.com" method="POST">
                            <input type="hidden" name="_subject" value="New message from my website">
                            <input type="hidden" name="_template" value="table">
                            <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
                            <label for="contact-name">Your name
                                <input id="contact-name" name="name" type="text" autocomplete="name" required>
                            </label>
                            <label for="contact-email">Your email
                                <input id="contact-email" name="email" type="email" autocomplete="email" required>
                            </label>
                            <label for="contact-message">Message
                                <textarea id="contact-message" name="message" rows="5" required></textarea>
                            </label>
                            <button class="contact-button" type="submit">Send Message <span>↗</span></button>
                        </form>
                    </div>
                </article>
            </div>
        </section>

        <footer class="contact-window">
            <div class="contact-heading">
                <span class="contact-symbol">⌂</span>
                <div>
                    <h2>Back to Home</h2>
                    <p>Return to the main page.</p>
                </div>
            </div>
            <a class="contact-button" href="index.html">Home <span>↗</span></a>
        </footer>
    </main>

</body>
</html>
