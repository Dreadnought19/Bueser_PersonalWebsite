<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="My personal website gallery.">
    <title>My Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="desktop">
        <section class="gallery-window" aria-labelledby="gallery-heading">
            <div class="section-titlebar">
                <h2 id="gallery-heading">My Gallery</h2>
                <span class="section-tag">PICTURES</span>
            </div>
            <div class="gallery-grid">
                <figure class="gallery-item">
                    <div class="gallery-frame">
                        <div class="gallery-placeholder"><img src="New folder/1.jpg"></div>
                    </div>
                    <figcaption>Childhood Memories</figcaption>
                </figure>
                <figure class="gallery-item">
                    <div class="gallery-frame">
                        <div class="gallery-placeholder"><img src="New folder/2.jpg"></div>
                    </div>
                    <figcaption>Family Photo</figcaption>
                </figure>
                <figure class="gallery-item">
                    <div class="gallery-frame">
                        <div class="gallery-placeholder"><img src="New folder/3.jpg"></div>
                    </div>
                    <figcaption>Drum and Lyre</figcaption>
                </figure>
                <figure class="gallery-item">
                    <div class="gallery-frame">
                        <div class="gallery-placeholder"><img src="New folder/4.jpg"></div>
                    </div>
                    <figcaption>Last Elementary Field Trip</figcaption>
                </figure>
                <figure class="gallery-item">
                    <div class="gallery-frame">
                        <div class="gallery-placeholder"><img src="New folder/5.jpg"></div>
                    </div>
                    <figcaption>Last Prom</figcaption>
                </figure>
                <figure class="gallery-item">
                    <div class="gallery-frame">
                        <div class="gallery-placeholder"><img src="New folder/6.jpg"></div>
                    </div>
                    <figcaption>Farewell to my Father</figcaption>
                </figure>
            </div>
        </section>

        <footer class="contact-window">
            <div class="contact-heading">
                <span class="contact-symbol">⌂</span>
                <div>
                    <h2>Back to Home</h2>
                    <p>Return to the main page.</p>
                </div>
            </div>
            <a class="contact-button" href="index.html">Home <span>↗</span></a>
        </footer>
    </main>
</body>
</html>
